apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: flask-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: orders-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SERVICE_NAME
              value: orders-service
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: flask-microservices
spec:
  type: ClusterIP
  selector:
    app: orders-service
  ports:
    - name: http
      port: 5000
      targetPort: http